server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:h2:mem:transactiondb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

application:
  config:
    account-service-url: http://localhost:8081
    customer-service-url: http://localhost:8082
